# Deliberately its own workspace root: this crate lives in the Lance fork's
# tree for convenience but is not a member of its workspace. Cargo grants
# workspace members no extra visibility, so the boundary would be the same
# either way; staying out keeps the fork's root manifest and lockfiles
# untouched and makes extraction into a standalone repository a directory move.
[workspace]

[package]
name = "lance-vamana"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Disk-resident Vamana vector index for Lance datasets"
license = "Apache-2.0"
publish = false

[dependencies]
# Default features pull the whole cloud-SDK tree; this crate indexes local files.
lance = { path = "../lance", default-features = false }
lance-arrow = { path = "../lance-arrow" }
lance-core = { path = "../lance-core" }
lance-encoding = { path = "../lance-encoding" }
lance-file = { path = "../lance-file" }
lance-index = { path = "../lance-index" }
lance-io = { path = "../lance-io" }
lance-linalg = { path = "../lance-linalg" }
lance-table = { path = "../lance-table" }

arrow-array = "58.0.0"
arrow-cast = { version = "58.0.0", optional = true }
arrow-schema = "58.0.0"
arrow-select = "58.0.0"
clap = { version = "4", features = ["derive"], optional = true }
futures = "0.3"
log = "0.4"
object_store = "0.13.2"
prost = "0.14.1"
prost-types = "0.14.1"
rand = { version = "0.9.1", features = ["small_rng"] }
roaring = "0.11.4"
semver = "1.0"
serde = { version = "^1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.23", features = ["macros", "rt-multi-thread"], optional = true }
uuid = { version = "1.2", features = ["v4"] }

[features]
# On by default so the binary builds without a flag; a consumer embedding only
# the library turns it off with `default-features = false` and compiles no clap.
default = ["cli"]
cli = ["dep:arrow-cast", "dep:clap", "dep:tokio"]

# A separate crate that links the library, so it reaches nothing the library
# does not export - the same boundary an out-of-tree consumer sees, checked by
# the compiler rather than by a rule. `src/bin/` would have been the tidier
# home for it, but the repository's `.gitignore` ignores every `bin/` directory
# at any depth, and editing that file is outside this crate.
[[bin]]
name = "vamana"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.23", features = ["macros", "rt-multi-thread"] }
